<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Operations Dashboard — NextAI</title>
<style>
  :root{
    --bg:#0a0a0b; --panel:rgba(255,255,255,0.04); --line:rgba(255,255,255,0.09);
    --line-hi:rgba(255,255,255,0.22); --ink:#f4f4f5; --muted:#a1a1aa; --dim:#71717a;
    --glass:rgba(255,255,255,0.03);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  .page{max-width:1500px;margin:0 auto;padding:28px 22px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    padding-bottom:18px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .brand h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.2px;}
  .brand .sub{font-size:11px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .topmeta{display:flex;align-items:center;gap:14px;}
  #syncInfo{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;}
  .ver{font-size:10px;color:#fff;font-weight:600;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px;}
  .filter-btn{padding:7px 14px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);border-radius:999px;font-size:12px;cursor:pointer;transition:all .15s;}
  .filter-btn:hover{color:#fff;border-color:var(--line-hi);}
  .filter-btn.active{background:#fff;color:#000;font-weight:600;border-color:#fff;}
  .ops-grid{display:grid;gap:22px;grid-template-columns:1fr;margin-top:22px;}
  @media(min-width:768px){.ops-grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1100px){.ops-grid{grid-template-columns:repeat(4,1fr);}}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .col.hide{display:none;}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;
    border-bottom:1px solid var(--line);}
  .col-head .t{font-size:11px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);}
  .col-head .c{font-size:10px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;}
  .container{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;
    position:relative;cursor:pointer;transition:transform .15s,border-color .15s;}
  .card:hover{transform:translateY(-3px);border-color:var(--line-hi);}
  .card .r1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
  .card .code{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);}
  .badge{font-size:10px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:#d4d4d8;white-space:nowrap;}
  .badge.urgent{background:#fff;color:#000;font-weight:600;border-color:#fff;}
  .card .title{font-size:14px;font-weight:600;color:#fff;}
  .card .amt{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin-top:6px;}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;
    border-top:1px solid var(--line);font-size:11px;font-family:ui-monospace,Menlo,monospace;}
  .kv .lbl{font-size:9px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px;}
  .kv .val{color:#d4d4d8;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .btn{flex:1;padding:6px;font-size:11px;font-weight:600;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);transition:all .15s;}
  .btn.approve{background:#fff;color:#000;border-color:#fff;}
  .btn.approve:hover{background:#e4e4e7;}
  .btn.reject:hover{color:#fff;border-color:var(--line-hi);}
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.95);border:1px solid var(--line-hi);
    border-radius:16px;padding:15px;opacity:0;transition:opacity .2s;display:flex;flex-direction:column;
    justify-content:space-between;pointer-events:none;}
  .card:hover .overlay{opacity:1;}
  .overlay .ai{display:flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .overlay .ai .d{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 2s infinite;}
  .overlay p{font-size:11px;color:#d4d4d8;margin:0;line-height:1.5;}
  .overlay .note{font-size:10px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;}
  .show-more{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:transparent;
    color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;margin-top:2px;}
  .show-more:hover{color:#fff;border-color:var(--line-hi);}
  .empty{padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--dim);font-size:12px;}
  .err{padding:14px;border:1px solid #7f1d1d;background:rgba(127,29,29,.15);border-radius:12px;color:#fca5a5;font-size:12px;}
  footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);
    font-family:ui-monospace,Menlo,monospace;flex-wrap:wrap;gap:8px;}
  .loading{padding:30px;text-align:center;color:var(--dim);font-size:13px;}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Operations Dashboard</h1>
        <div class="sub" id="companyLine">NextAI Subsystem</div>
      </div>
    </div>
    <div class="topmeta">
      <span id="syncInfo">Loading…</span>
      <span class="ver">v1.0.0</span>
    </div>
  </div>

  <div class="filters" id="filterBar">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="sales">Sales</button>
    <button class="filter-btn" data-cat="inventory">Inventory</button>
    <button class="filter-btn" data-cat="approvals">Approvals</button>
    <button class="filter-btn" data-cat="expenses">Expenses</button>
  </div>

  <main class="ops-grid" id="grid">
    <section class="col" id="section-sales">
      <div class="col-head"><span class="t">Sales Pipeline</span><span class="c" id="count-sales">0 Cards</span></div>
      <div class="container" id="salesContainer"></div>
      <button class="show-more" data-mod="sales" style="display:none">Show More</button>
    </section>

    <section class="col" id="section-inventory">
      <div class="col-head"><span class="t">Inventory Movement</span><span class="c" id="count-inventory">0 Cards</span></div>
      <div class="container" id="inventoryContainer"></div>
      <button class="show-more" data-mod="inventory" style="display:none">Show More</button>
    </section>

    <section class="col" id="section-approvals">
      <div class="col-head"><span class="t">Action Approvals</span><span class="c" id="count-approvals">0 Cards</span></div>
      <div class="container" id="approvalsContainer"></div>
      <button class="show-more" data-mod="approvals" style="display:none">Show More</button>
    </section>

    <section class="col" id="section-expenses">
      <div class="col-head"><span class="t">Expense Velocity</span><span class="c" id="count-expenses">0 Cards</span></div>
      <div class="container" id="expensesContainer"></div>
      <button class="show-more" data-mod="expenses" style="display:none">Show More</button>
    </section>
  </main>

  <footer>
    <span>Connected: http://erp.localhost/desk/</span>
    <span>NextAI Subsystem Active</span>
  </footer>
</div>

<script>
const API = "vehicle_management.vehicle_management.dashboard_api.get_dashboard_cards";
const LIMIT = 10;
const shown = { sales: LIMIT, inventory: LIMIT, approvals: LIMIT, expenses: LIMIT };
let DATA = null;
const SYM = { PHP:"₱", USD:"$", EUR:"€", GBP:"£" };

function csrf(){
  try { if (window.frappe && window.frappe.csrf_token) return window.frappe.csrf_token; } catch(e){}
  const m = document.cookie.match(/frappe_csrf_token=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
function money(v, cur){
  const s = SYM[cur] || (cur || "");
  const n = (v==null?0:v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return s + n + (SYM[cur]?" " + cur:"");
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; return String(d).slice(0,10); }

function salesCard(r){
  return `<div class="card" data-tip="Customer: ${esc(r.customer_name||r.customer)}&#10;Posted: ${fmtDate(r.posting_date)}&#10;Status: ${esc(r.status)}">
    <div class="r1"><span class="code">${esc(r.name)}</span><span class="badge">${esc(r.status||"Draft")}</span></div>
    <div class="title">${esc(r.customer_name||r.customer)}</div>
    <div class="amt">${money(r.grand_total, DATA.currency)}</div>
    <div class="overlay"><div><div class="ai"><span class="d"></span>NextAI Record</div>
      <p>Customer: ${esc(r.customer_name||r.customer)}<br>Invoice: ${esc(r.name)}<br>Posted: ${fmtDate(r.posting_date)}</p></div>
      <div class="note">Status: ${esc(r.status)}</div></div>
  </div>`;
}
function invCard(r){
  return `<div class="card" data-tip="Item: ${esc(r.item_code)}&#10;Bin: ${esc(r.bin_location||"—")}&#10;Qty: ${r.actual_qty}">
    <div class="r1"><span class="code">${esc(r.voucher_no||r.name)}</span><span class="badge">${esc(r.voucher_type||"Move")}</span></div>
    <div class="title">${esc(r.item_code)}</div>
    <div class="kv">
      <div><span class="lbl">From / Bin</span><span class="val">${esc(r.warehouse||"—")}</span><span class="val" style="color:var(--dim)">Bin: ${esc(r.bin_location||"—")}</span></div>
      <div><span class="lbl">Qty / Date</span><span class="val">${r.actual_qty}</span><span class="val" style="color:var(--dim)">${fmtDate(r.posting_date)}</span></div>
    </div>
    <div class="overlay"><div><div class="ai"><span class="d"></span>NextAI Logistics</div>
      <p>Item: ${esc(r.item_code)}<br>Warehouse: ${esc(r.warehouse||"—")}<br>Bin: ${esc(r.bin_location||"—")}<br>Qty: ${r.actual_qty} · ${fmtDate(r.posting_date)}</p></div>
      <div class="note">Voucher: ${esc(r.voucher_type)} ${esc(r.voucher_no||"")}</div></div>
  </div>`;
}
function apprCard(r){
  return `<div class="card" data-tip="Supplier: ${esc(r.supplier)}&#10;Amount: ${money(r.grand_total,DATA.currency)}&#10;Date: ${fmtDate(r.transaction_date)}">
    <div class="r1"><span class="code">${esc(r.name)}</span><span class="badge urgent">Pending</span></div>
    <div class="title">${esc(r.supplier)}</div>
    <div class="amt">${money(r.grand_total, DATA.currency)} · ${fmtDate(r.transaction_date)}</div>
    <div class="actions">
      <button class="btn approve" data-act="approve" data-name="${esc(r.name)}">Approve</button>
      <button class="btn reject" data-act="reject" data-name="${esc(r.name)}">Reject</button>
    </div>
    <div class="overlay"><div><div class="ai"><span class="d"></span>NextAI Compliance</div>
      <p>Supplier: ${esc(r.supplier)}<br>Amount: ${money(r.grand_total,DATA.currency)}<br>Date: ${fmtDate(r.transaction_date)}<br>Status: ${esc(r.status||"Draft")}</p></div>
      <div class="note">Awaiting approval action</div></div>
  </div>`;
}
function expCard(r){
  return `<div class="card" data-tip="Supplier: ${esc(r.supplier)}&#10;Amount: ${money(r.grand_total,DATA.currency)}&#10;Posted: ${fmtDate(r.posting_date)}">
    <div class="r1"><span class="code">${esc(r.name)}</span><span class="badge">${esc(r.status||"Billed")}</span></div>
    <div class="title">${esc(r.supplier)}</div>
    <div class="amt">${money(r.grand_total, DATA.currency)} · ${fmtDate(r.posting_date)}</div>
    <div class="overlay"><div><div class="ai"><span class="d"></span>NextAI Spend</div>
      <p>Supplier: ${esc(r.supplier)}<br>Bill: ${esc(r.name)}<br>Posted: ${fmtDate(r.posting_date)}<br>Status: ${esc(r.status)}</p></div>
      <div class="note">Amount: ${money(r.grand_total,DATA.currency)}</div></div>
  </div>`;
}

function render(mod){
  const map = { sales:["salesContainer",salesCard,"sales"],
    inventory:["inventoryContainer",invCard,"inventory"],
    approvals:["approvalsContainer",apprCard,"approvals"],
    expenses:["expensesContainer",expCard,"expenses"] };
  const [cid, fn, key] = map[mod];
  const list = (DATA && DATA[key]) || [];
  const box = document.getElementById(cid);
  const n = Math.min(shown[mod], list.length);
  if (list.length === 0){
    box.innerHTML = `<div class="empty">No ${mod} records found.</div>`;
  } else {
    box.innerHTML = list.slice(0, n).map(fn).join("");
  }
  document.getElementById("count-"+mod).textContent = list.length + " Cards";
  const btn = document.querySelector('.show-more[data-mod="'+mod+'"]');
  if (list.length > LIMIT){ btn.style.display="block"; btn.textContent = (shown[mod] < list.length) ? ("Show More ("+Math.min(LIMIT, list.length-shown[mod])+" more)") : "Show Less"; }
  else { btn.style.display="none"; }
}

function renderAll(){ ["sales","inventory","approvals","expenses"].forEach(render); bindActions(); }

function applyFilter(ev){
  const cat = ev.currentTarget.getAttribute("data-cat");
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  ev.currentTarget.classList.add("active");
  const sec = { sales:"section-sales", inventory:"section-inventory", approvals:"section-approvals", expenses:"section-expenses" };
  Object.keys(sec).forEach(k => {
    document.getElementById(sec[k]).classList.toggle("hide", !(cat==="all"||cat===k));
  });
}

function loadMore(mod){
  if (shown[mod] < ((DATA&&DATA[mod])||[]).length) shown[mod] += LIMIT;
  else shown[mod] = LIMIT;
  render(mod); bindActions();
}

async function approvePO(name){
  const token = csrf();
  try {
    const get = await fetch("/api/resource/Purchase%20Order/"+encodeURIComponent(name), {headers:{"X-Frappe-CSRF-Token":token}});
    const doc = (await get.json()).data;
    const res = await fetch("/api/method/frappe.client.submit", {method:"POST",
      headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":token},
      body: JSON.stringify({doc: doc})});
    const j = await res.json();
    if (j.exc) throw new Error(j.exc);
    flash("Approved "+name);
  } catch(e){ flash("Approve failed: "+e.message); }
}
async function rejectPO(name){
  const token = csrf();
  try {
    const res = await fetch("/api/resource/Purchase%20Order/"+encodeURIComponent(name), {method:"DELETE",
      headers:{"X-Frappe-CSRF-Token":token}});
    const j = await res.json();
    if (j.exc) throw new Error(j.exc);
    flash("Rejected "+name);
  } catch(e){ flash("Reject failed: "+e.message); }
}
function bindActions(){
  document.querySelectorAll(".btn.approve,.btn.reject").forEach(b => {
    b.onclick = (e) => { e.stopPropagation();
      const nm = b.getAttribute("data-name");
      if (b.getAttribute("data-act")==="approve") approvePO(nm); else rejectPO(nm);
    };
  });
}
function flash(msg){
  const el = document.getElementById("syncInfo");
  const prev = el.textContent; el.textContent = msg;
  setTimeout(()=>{ el.textContent = prev; }, 2500);
  if (/failed/i.test(msg)) loadData();
}

async function loadData(){
  const el = document.getElementById("syncInfo");
  el.textContent = "Syncing…";
  try {
    const res = await fetch("/api/method/"+API, {method:"POST",
      headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":csrf()},
      body: JSON.stringify({ limit: LIMIT })});
    const j = await res.json();
    if (j.exc) throw new Error(j.exc);
    DATA = j.message || {};
    document.getElementById("companyLine").textContent = "NextAI · " + (DATA.company||"") + (DATA.currency?(" · "+DATA.currency):"");
    renderAll();
    el.textContent = "Last sync " + new Date().toLocaleTimeString();
  } catch(e){
    document.getElementById("grid").innerHTML = '<div class="err">Failed to load data: '+esc(e.message)+'</div>';
    el.textContent = "Sync failed";
  }
}

document.getElementById("filterBar").addEventListener("click", applyFilter);
document.querySelectorAll(".show-more").forEach(b => b.onclick = () => loadMore(b.getAttribute("data-mod")));
loadData();
</script>
</body>
</html>
